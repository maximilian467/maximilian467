name: Update README card

on:
  schedule:
    - cron: "17 */12 * * *"
  # Redraw right away when my laptop pushes a new token count or the card changes
  push:
    branches: [main]
    paths: [data/**, scripts/generate_card.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-card
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the card
        env:
          # Contributions and star counts are public, so the built-in token is enough
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_card.py

      - name: Commit if the card changed
        run: |
          git diff --quiet -- assets/ && exit 0
          # New query string so GitHub's image cache picks up the new card
          sed -i -E "s/card-(light|dark)\.svg\?v=[0-9]+/card-\1.svg?v=$(date +%s)/g" README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md
          git commit -m "chore: redraw README card"
          git pull --rebase
          git push
